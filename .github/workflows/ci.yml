name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Instalar Chromium para los tests de senal
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de senal (renderizado real de Web Audio)
        run: pnpm test:signal

      - name: Contrato de tokens
        run: pnpm check:tokens

      - name: Build
        run: pnpm build
