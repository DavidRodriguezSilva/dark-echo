    <title>dark echo</title>
    <!--
      Aplica tema y esquema antes del primer dibujado (theming, tarea 13.6):
      un script de modulo se difiere hasta despues de parsear el HTML, lo que
      dejaria una ventana en la que se pinta el esquema por defecto antes de
      corregirlo. Este script clasico y sincrono corre inline, sin esperar.
      Usa a mano la misma clave y formato que platform/appearance.ts porque
      no puede esperar a que el grafo de modulos cargue para importarlo.

      El esquema guardado puede ser "auto": no es un valor literal a aplicar,
      hay que resolverlo contra el sistema igual que
      platform/appearance.ts#resolveScheme. Sin eso, alguien en "auto" con el
      sistema en claro veria un flash de oscuro antes de que React monte.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("dark-echo.appearance");
          var envelope = raw ? JSON.parse(raw) : null;
          var preference = envelope && envelope.version === 1 ? envelope.data : null;
          var storedScheme = preference && preference.scheme;
          var scheme =
            storedScheme && storedScheme !== "auto"
              ? storedScheme
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var themeId = (preference && preference.themeId) || "default";

          document.documentElement.dataset.theme = themeId;
          document.documentElement.classList.toggle("light", scheme === "light");
        } catch {
          // Almacenamiento no disponible o corrupto: se queda en el
          // esquema oscuro por defecto, que ya trae `:root` sin JavaScript.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
